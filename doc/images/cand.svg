<rect x="536" y="50" width="70" height="32" rx="6" fill="#ddd"/><text x="548" y="72" fill="#333">6 地</text>
<text x="620" y="72" fill="#333">← →</text>
</g>
<text x="24" y="128" font-size="14" fill="currentColor">左右滑动：整条候选，功能行左右走到头尾</text>
