<rect x="348" y="150" width="70" height="32" rx="6" fill="#ddd"/><text x="362" y="172" fill="#333">5</text>
<rect x="426" y="150" width="70" height="32" rx="6" fill="#ddd"/><text x="440" y="172" fill="#333">6</text>
