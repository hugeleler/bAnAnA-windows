<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220">
<text x="24" y="28" font-size="14" fill="currentColor">左右按钮：一屏一页（随方案 banana=6）</text>
<rect x="24" y="40" width="672" height="52" rx="8" fill="#eee" stroke="#bbb"/>
<g font-size="13">
<rect x="36" y="50" width="90" height="32" rx="6" fill="#F2517A"/><text x="58" y="72" fill="#fff">1 的</text>
<rect x="136" y="50" width="90" height="32" rx="6" fill="#ddd"/><text x="158" y="72" fill="#333">2 地</text>
<rect x="236" y="50" width="90" height="32" rx="6" fill="#ddd"/><text x="258" y="72" fill="#333">3 得</text>
