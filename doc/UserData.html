<h1>用户数据</h1>
<p>Windows 的用户数据在：</p>
<p><code>%AppData%\bAnAnA</code></p>
<p>这里放补丁、安装标识、编译结果、用户词典、挂载、选用的皮肤和语言模型文件名。可以删编译结果后重新部署，不要手改二进制表。</p>
<p>不要和鼠须管 / 小狼毫的 Rime 目录混用，也不要共用 <code>installation.yaml</code>。</p>
