<h1>常见问题</h1>
<h2>和 Weasel 抢配置？</h2>
<p>确认用户目录是 <code>%AppData%\bAnAnA</code>，注册表是 <code>Software\bAnAnA</code>。</p>
<h2>检查更新不弹，但我刚换了包？</h2>
<p>频道只比较版本字符串 1.1.2.5。同版本覆盖要手动装 exe。</p>
<h2>安装包里没有语言模型？</h2>
<p>故意的。在菜单「语言模型」里下载再选用。</p>
