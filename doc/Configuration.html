<h1>配置</h1>
<p>方案与补丁是 UTF-8 YAML。补丁根节点 <code>patch</code>，键用斜线表示层级。先出厂 <code>rime/</code>，再用用户文件覆盖，部署进编译目录。</p>
<p>Windows 的界面偏好（若有）不写在 schema 里，写在本端设置存储。</p>
